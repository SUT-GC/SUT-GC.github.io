---
layout: blog
---

<div class="ppt-page-wrapper">
  <div class="ppt-grid">
    {% for item in site.data.kepu %}
    <a href="{{ item.url }}" class="ppt-card" target="_blank" rel="noopener">
      <div class="ppt-icon">{{ item.icon }}</div>
      <div class="ppt-info">
        <h3>{{ item.name }}</h3>
        <p>{{ item.description }}</p>
      </div>
      <svg class="ppt-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M7 17L17 7M17 7H7M17 7V17"/>
      </svg>
    </a>
    {% endfor %}
  </div>
</div>

<style>
.ppt-page-wrapper {
  max-width: 1100px;
  margin: 0 auto;
  padding: 40px 20px 80px;
}

.ppt-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 24px;
}

.ppt-card {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 28px 32px;
  background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
  border: 1px solid rgba(0, 0, 0, 0.08);
  border-radius: 20px;
  text-decoration: none;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
}

.ppt-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.08) 0%, rgba(147, 51, 234, 0.08) 100%);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.ppt-card:hover {
  border-color: rgba(59, 130, 246, 0.4);
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(59, 130, 246, 0.15);
}

.ppt-card:hover::before {
  opacity: 1;
}

.ppt-icon {
  position: relative;
  width: 56px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.8rem;
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(147, 51, 234, 0.15) 100%);
  border-radius: 14px;
  flex-shrink: 0;
}

.ppt-info {
  flex: 1;
  min-width: 0;
  position: relative;
}

.ppt-info h3 {
  margin: 0 0 6px;
  font-size: 1.15rem;
  font-weight: 600;
  color: #1a1a2e;
}

.ppt-info p {
  margin: 0;
  font-size: 0.9rem;
  color: rgba(0, 0, 0, 0.5);
  line-height: 1.6;
}

.ppt-arrow {
  position: relative;
  color: rgba(0, 0, 0, 0.25);
  flex-shrink: 0;
  transition: all 0.3s ease;
}

.ppt-card:hover .ppt-arrow {
  color: #3b82f6;
  transform: translate(3px, -3px);
}

@media (max-width: 720px) {
  .ppt-page-wrapper {
    padding: 30px 16px 60px;
  }

  .ppt-grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .ppt-card {
    padding: 22px 24px;
    gap: 16px;
  }

  .ppt-icon {
    width: 48px;
    height: 48px;
    font-size: 1.5rem;
  }

  .ppt-info h3 {
    font-size: 1.05rem;
  }
}
</style>

{{ content }}
