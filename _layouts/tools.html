---
layout: blog
---

<div class="tools-page-wrapper">
  <div class="tools-content">
    <header class="tools-header">
      <h1>工具收藏</h1>
      <p>实用在线工具集合</p>
    </header>

    <div class="tools-grid">
      {% for tool in site.data.tools %}
      <a href="{{ tool.url }}" class="tool-card" target="_blank" rel="noopener">
        <div class="tool-icon">{{ tool.icon }}</div>
        <div class="tool-info">
          <h3>{{ tool.name }}</h3>
          <p>{{ tool.description }}</p>
        </div>
        <svg class="tool-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 17L17 7M17 7H7M17 7V17"/>
        </svg>
      </a>
      {% endfor %}
    </div>
  </div>
</div>

<style>
.tools-page-wrapper {
  min-height: 100vh;
  background: linear-gradient(180deg, #0d0d1a 0%, #1a1a2e 50%, #16213e 100%);
  margin: -20px -20px 0;
  padding: 60px 20px 100px;
}

.tools-content {
  max-width: 1000px;
  margin: 0 auto;
}

.tools-header {
  text-align: center;
  margin-bottom: 50px;
}

.tools-header h1 {
  font-size: 2.5rem;
  font-weight: 700;
  color: #fff;
  margin: 0 0 12px;
  background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #f97316 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.tools-header p {
  color: rgba(255, 255, 255, 0.5);
  font-size: 1rem;
  margin: 0;
}

.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}

.tool-card {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px 24px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 16px;
  text-decoration: none;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.tool-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.1) 0%, rgba(236, 72, 153, 0.1) 100%);
  opacity: 0;
  transition: opacity 0.3s ease;
}

.tool-card:hover {
  border-color: rgba(168, 85, 247, 0.4);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(168, 85, 247, 0.15);
}

.tool-card:hover::before {
  opacity: 1;
}

.tool-icon {
  position: relative;
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  background: linear-gradient(135deg, rgba(168, 85, 247, 0.2) 0%, rgba(236, 72, 153, 0.2) 100%);
  border-radius: 12px;
  flex-shrink: 0;
}

.tool-info {
  flex: 1;
  min-width: 0;
  position: relative;
}

.tool-info h3 {
  margin: 0 0 4px;
  font-size: 1rem;
  font-weight: 600;
  color: #fff;
}

.tool-info p {
  margin: 0;
  font-size: 0.85rem;
  color: rgba(255, 255, 255, 0.5);
  line-height: 1.5;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tool-arrow {
  position: relative;
  color: rgba(255, 255, 255, 0.3);
  flex-shrink: 0;
  transition: all 0.3s ease;
}

.tool-card:hover .tool-arrow {
  color: #a855f7;
  transform: translate(2px, -2px);
}

@media (max-width: 640px) {
  .tools-page-wrapper {
    padding: 40px 16px 80px;
  }

  .tools-header h1 {
    font-size: 2rem;
  }

  .tools-grid {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .tool-card {
    padding: 16px 20px;
  }

  .tool-icon {
    width: 42px;
    height: 42px;
    font-size: 1.3rem;
  }
}
</style>

{{ content }}
