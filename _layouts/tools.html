---
layout: blog
---

<div class="tools-container">
  <!-- 背景装饰 -->
  <div class="tools-bg">
    <div class="tools-orb tools-orb-1"></div>
    <div class="tools-orb tools-orb-2"></div>
    <div class="tools-orb tools-orb-3"></div>
  </div>

  <header class="tools-header">
    <div class="tools-badge">收藏夹</div>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
    <p class="tools-description">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="tools-grid">
    {% for tool in site.data.tools %}
    <a href="{{ tool.url }}" class="tool-card" target="_blank" rel="noopener">
      <div class="tool-card-glow"></div>
      <div class="tool-card-content">
        <div class="tool-icon-wrapper">
          <div class="tool-icon">{{ tool.icon }}</div>
        </div>
        <div class="tool-info">
          <h3>{{ tool.name }}</h3>
          <p>{{ tool.description }}</p>
        </div>
        <div class="tool-arrow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M7 17L17 7M17 7H7M17 7V17"/>
          </svg>
        </div>
      </div>
    </a>
    {% endfor %}
  </div>

  {% if site.data.tools.size == 0 %}
  <div class="tools-empty">
    <div class="tools-empty-icon">🔧</div>
    <p>暂无工具，敬请期待...</p>
  </div>
  {% endif %}
</div>

<style>
/* 工具页面容器 */
.tools-container {
  position: relative;
  max-width: 1200px;
  margin: 0 auto;
  padding: 60px 24px 100px;
  min-height: 80vh;
}

/* 背景装饰 */
.tools-bg {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: -1;
}

.tools-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.15;
}

.tools-orb-1 {
  width: 500px;
  height: 500px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  top: -10%;
  left: -10%;
  animation: tools-float 20s ease-in-out infinite;
}

.tools-orb-2 {
  width: 400px;
  height: 400px;
  background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  bottom: 10%;
  right: -5%;
  animation: tools-float 25s ease-in-out infinite reverse;
}

.tools-orb-3 {
  width: 300px;
  height: 300px;
  background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: tools-float 18s ease-in-out infinite;
}

@keyframes tools-float {
  0%, 100% { transform: translate(0, 0) scale(1); }
  25% { transform: translate(30px, -30px) scale(1.05); }
  50% { transform: translate(-20px, 20px) scale(0.95); }
  75% { transform: translate(10px, 40px) scale(1.02); }
}

/* 头部 */
.tools-header {
  text-align: center;
  margin-bottom: 60px;
  position: relative;
}

.tools-badge {
  display: inline-block;
  padding: 6px 16px;
  background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
  border: 1px solid rgba(102, 126, 234, 0.3);
  border-radius: 20px;
  font-size: 13px;
  color: #667eea;
  margin-bottom: 20px;
  font-weight: 500;
}

.tools-header h1 {
  font-size: clamp(2.5rem, 5vw, 3.5rem);
  font-weight: 700;
  margin: 0 0 16px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.tools-description {
  font-size: 1.1rem;
  color: #666;
  margin: 0;
  max-width: 500px;
  margin: 0 auto;
}

/* 工具网格 */
.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 24px;
}

/* 工具卡片 */
.tool-card {
  position: relative;
  display: block;
  text-decoration: none;
  color: inherit;
  border-radius: 20px;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.tool-card-glow {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  opacity: 0;
  transition: opacity 0.4s ease;
  z-index: 0;
}

.tool-card:hover .tool-card-glow {
  opacity: 1;
}

.tool-card-content {
  position: relative;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 28px;
  background: #fff;
  border: 1px solid rgba(0, 0, 0, 0.08);
  border-radius: 20px;
  transition: all 0.4s ease;
  z-index: 1;
}

.tool-card:hover .tool-card-content {
  transform: translate(-4px, -4px);
  box-shadow: 8px 8px 0 rgba(102, 126, 234, 0.3);
}

/* 图标 */
.tool-icon-wrapper {
  flex-shrink: 0;
}

.tool-icon {
  width: 64px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
  border-radius: 16px;
  transition: all 0.4s ease;
}

.tool-card:hover .tool-icon {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  transform: scale(1.1) rotate(-5deg);
  box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
}

/* 信息 */
.tool-info {
  flex: 1;
  min-width: 0;
}

.tool-info h3 {
  margin: 0 0 8px;
  font-size: 1.15rem;
  font-weight: 600;
  color: #1a1a2e;
  transition: color 0.3s ease;
}

.tool-card:hover .tool-info h3 {
  color: #667eea;
}

.tool-info p {
  margin: 0;
  font-size: 0.9rem;
  color: #666;
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* 箭头 */
.tool-arrow {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f5f7fa;
  border-radius: 12px;
  color: #999;
  transition: all 0.4s ease;
}

.tool-card:hover .tool-arrow {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #fff;
  transform: translate(4px, -4px);
}

/* 空状态 */
.tools-empty {
  text-align: center;
  padding: 80px 20px;
}

.tools-empty-icon {
  font-size: 4rem;
  margin-bottom: 20px;
  opacity: 0.5;
}

.tools-empty p {
  color: #999;
  font-size: 1.1rem;
}

/* 响应式 */
@media (max-width: 768px) {
  .tools-container {
    padding: 40px 16px 80px;
  }

  .tools-grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .tool-card-content {
    padding: 20px;
    gap: 16px;
  }

  .tool-icon {
    width: 52px;
    height: 52px;
    font-size: 1.6rem;
  }

  .tool-arrow {
    display: none;
  }
}

/* 暗色模式支持 */
@media (prefers-color-scheme: dark) {
  .tools-description {
    color: #aaa;
  }

  .tool-card-content {
    background: #1a1a2e;
    border-color: rgba(255, 255, 255, 0.1);
  }

  .tool-info h3 {
    color: #e8e8ed;
  }

  .tool-info p {
    color: #999;
  }

  .tool-icon {
    background: linear-gradient(135deg, #2a2a3e 0%, #1a1a2e 100%);
  }

  .tool-arrow {
    background: #2a2a3e;
    color: #666;
  }
}
</style>

{{ content }}
